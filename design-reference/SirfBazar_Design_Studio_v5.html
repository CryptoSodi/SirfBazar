function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function slogan(){return imgAsset('sirfbazar-slogan-urdu.svg','slogan','بازار وہی۔ طریقہ نیا۔')}
function atts(data={}){return Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}
function button(text,act,data={},cls='',ic=''){return `<button class="btn ${cls}" type="button" data-act="${act}" ${atts(data)}>${ic?icon(ic,'sm'):''}${text}</button>`}
function goButton(text,route,cls='',ic=''){return button(text,'go',{route},cls,ic)}
function link(text,route){return `<button type="button" class="link-btn" data-act="go" data-route="${esc(route)}">${text}${icon('arrow','sm')}</button>`}
function ib(ic,label,act,data={}){return `<button type="button" class="icon-btn" aria-label="${esc(label)}" title="${esc(label)}" data-act="${act}" ${atts(data)}>${icon(ic)}</button>`}

function chart(orders){const hours=[9,10,11,12,13,14];const counts=hours.map(h=>orders.filter(o=>parseInt(o.time)===h).length);const delivered=hours.map(h=>orders.filter(o=>parseInt(o.time)===h&&o.status==='delivered').length);const max=Math.max(3,...counts);return `<div class="chart-box"><svg viewBox="0 0 620 206" role="img" aria-label="Orders by placement hour in the demo snapshot">${[0,1,2,3].map(i=>`<line x1="25" y1="${18+i*49}" x2="610" y2="${18+i*49}" stroke="#e7ede4"/><text x="4" y="${22+i*49}" fill="#718478" font-size="10">${Math.round(max*(1-i/3))}</text>`).join('')}${hours.map((h,i)=>{let x=55+i*95;return `<rect x="${x}" y="${165-counts[i]/max*146}" width="26" height="${counts[i]/max*146}" rx="4" fill="#009966"/><rect x="${x+29}" y="${165-delivered[i]/max*146}" width="26" height="${delivered[i]/max*146}" rx="4" fill="#acdac1"/><text x="${x+27}" y="192" text-anchor="middle" fill="#718478" font-size="10">${h}:00</text>`}).join('')}</svg><div class="chart-labels"><span><i class="chart-key"></i>Placed orders</span><span><i class="chart-key light"></i>Now delivered</span></div></div>`}
function footer(){return `<footer class="preview-footer"><span>${icon('shield','sm')}Fictional demo data · ${memoryOnly?'Session-only changes':'Saved in this browser'}</span><span>SirfBazar design suite · ${SNAPSHOT}</span></footer>`}
function tabs(items,act='tab'){return `<div class="tabs">${items.map(t=>{let name=Array.isArray(t)?t[0]:t;return `<button data-act="${act}" data-value="${esc(name)}" class="${UI.tab===name?'active':''}">${esc(name)}${Array.isArray(t)?`<span>${t[1]}</span>`:''}</button>`}).join('')}</div>`}
function titleBar(title,sub,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${sub}</p></div><div class="row wrap">${actions}</div></div>`}
let CURRENT_TABLE=null;
function table(config){let rows=config.rows.slice();const q=UI.query.toLowerCase();if(q)rows=rows.filter(r=>[...Object.values(r).map(v=>typeof v==='object'?'':v),r.merchant?getMerchant(r.merchant).name:'',r.customerName||''].join(' ').toLowerCase().includes(q));if(UI.tab!=='All'&&config.filter)rows=rows.filter(r=>config.filter(r,UI.tab));if(UI.sort){const desc=UI.sort.startsWith('-'),key=UI.sort.replace(/^-/,'');rows.sort((a,b)=>typeof a[key]==='number'?(a[key]-b[key])*(desc?-1:1):String(a[key]??'').localeCompare(String(b[key]??''))*(desc?-1:1))}CURRENT_TABLE={...config,filtered:rows};const pageSize=config.pageSize||8,pages=Math.max(1,Math.ceil(rows.length/pageSize));UI.pageNumber=Math.min(UI.pageNumber,pages);const start=(UI.pageNumber-1)*pageSize;const visible=rows.slice(start,start+pageSize);return `<section class="card"><div class="table-toolbar"><div class="row wrap">${config.tabs?tabs(config.tabs):`<h3>${esc(config.title||'Records')}</h3>`}</div><div class="row">${searchField(config.search||'Search records…')}${ib('export','Export filtered CSV','export-table')}</div></div><div class="table-wrap"><table class="data-table"><thead><tr>${config.columns.map(c=>`<th class="${c.num?'num':''}">${c.sort?`<button class="link-btn" style="color:inherit;padding:0;font-size:11px" data-act="sort" data-key="${c.sort}">${c.label}${icon('down','sm')}</button>`:c.label}</th>`).join('')}</tr></thead><tbody>${visible.length?visible.map(r=>`<tr>${config.columns.map(c=>`<td class="${c.num?'num':''}">${c.render?c.render(r):esc(r[c.key]??'—')}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${config.columns.length}">${empty('No matching records','Try another search or clear the filters.',button('Clear filters','clear-filters',{},'secondary small'))}</td></tr>`}</tbody></table></div><div class="table-pagination"><span>${rows.length?start+1:0}–${Math.min(start+pageSize,rows.length)} of ${rows.length} records</span><div class="pages">${Array.from({length:pages},(_,i)=>`<button class="${i+1===UI.pageNumber?'active':''}" data-act="table-page" data-page="${i+1}" aria-label="Page ${i+1}">${i+1}</button>`).join('')}</div></div></section>`}
function orderColumns(role){return [{label:'Order',sort:'id',render:o=>`<button class="cell-title button" data-act="order-detail" data-id="${o.id}">#${o.id}</button><span class="cell-sub">Today · ${o.time}</span>`},{label:role==='admin'?'Merchant / customer':'Customer',render:o=>`<strong class="cell-title">${esc(role==='admin'?getMerchant(o.merchant).name:o.customerName)}</strong><span class="cell-sub">${esc(role==='admin'?o.customerName:o.area)}</span>`},{label:'Items',render:o=>`<strong>${o.items.reduce((a,p)=>a+p.qty,0)}</strong> <span class="muted">items</span>`},{label:'Payment',render:o=>tag(o.payment,o.payment==='COD'?'amber':'blue')},{label:'Order total',num:true,sort:'total',render:o=>`<strong class="num">${money(o.total)}</strong>`},{label:'Status',render:o=>statusTag(o.status)},{label:'Action',render:o=>button('View','order-detail',{id:o.id},'quiet small','eye')}];}
function orderTable(orders,role){return table({title:'Orders',rows:orders,search:'Search order, shop or customer…',tabs:['All','New','Preparing','Ready','On the way','Delivered'],filter:(o,t)=>({New:'new',Preparing:'preparing',Ready:'ready','On the way':'picked',Delivered:'delivered'}[t]===o.status),columns:orderColumns(role)})}
function ledger(merchant){const orders=state.orders.filter(o=>o.status==='delivered'&&o.merchant===merchant);let online=orders.filter(o=>o.payment==='Online'),cod=orders.filter(o=>o.payment==='COD');const sum=(arr,k)=>arr.reduce((s,o)=>s+o[k],0),onlineGross=sum(online,'total'),onlineFee=sum(online,'subtotal')*state.commission/100,codGross=sum(cod,'total'),codFee=sum(cod,'subtotal')*state.commission/100;return {id:merchant,merchant,orders:orders.length,onlineGross,onlineFee,payable:onlineGross-onlineFee,codGross,codFee,status:state.settlementDrafts.includes(merchant)?'Draft prepared':'Needs review'}}
function downloadCSV(name,rows){const clean=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const csv='\uFEFF'+rows.map(r=>r.map(clean).join(',')).join('\r\n');downloadFile(name,new Blob([csv],{type:'text/csv;charset=utf-8'}))}
function downloadFile(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function toast(text){const t=document.getElementById('toast');t.innerHTML=icon('checkcircle')+`<span>${esc(text)}</span>`;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),4200)}
function closeModal(){document.getElementById('dialog').close()}
function modal(title,body,sub='',cls=''){const d=document.getElementById('dialog');d.className=cls;d.innerHTML=`<div class="dialog-head"><div><h2 id="dialog-title">${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${ib('close','Close dialog','close-modal')}</div><div class="dialog-body">${body}</div>`;d.setAttribute('aria-labelledby','dialog-title');if(!d.open)d.showModal();setTimeout(()=>d.querySelector('input:not([type=checkbox]),textarea')?.focus(),40)}
function confirmDialog(title,text,act,data={},label='Confirm'){modal(title,`<p class="body-copy">${text}</p><div class="btn-row">${button('Cancel','close-modal',{},'secondary')}${button(label,act,data)}</div>`,'Local prototype action only')}
function errorIn(form,text){let e=form.querySelector('.form-error');if(!e){e=document.createElement('div');e.className='form-error';e.setAttribute('role','alert');form.append(e)}e.textContent=text}

function reportsPage(role){const orders=role==='merchant'?ownOrders():state.orders,done=orders.filter(o=>o.status==='delivered');return `${titleBar('Reports & insights','Readable summaries of the current fictional scenario.',button('Export order report','export-orders',{},'secondary','export'))}<div class="metrics">${metric('Orders placed',orders.length,'orders','Current fixed demo snapshot')}${metric('Delivered orders',done.length,'checkcircle','Completed demo records','blue')}${metric('Delivered merchandise',money(done.reduce((s,o)=>s+o.subtotal,0)),'chart','Not platform revenue','ink')}${metric('Cancelled orders',orders.filter(o=>o.status==='cancelled').length,'refresh','Sample cancellations','amber')}</div><div class="two-equal mb"><section class="card"><div class="card-header"><h2>Order activity by hour</h2>${tag('Today','gray')}</div>${chart(orders)}</section><section class="card pad"><h3 class="mb12">Payment mix · delivered orders</h3>${['COD','Online'].map(p=>{const count=done.filter(o=>o.payment===p).length;return `<div style="padding:16px 0"><div class="row between mb12"><strong class="small">${p}</strong><span class="small muted">${count} orders</span></div><div class="progress"><span style="width:${done.length?count/done.length*100:0}%"></span></div></div>`}).join('')}<p class="tiny mt12">These totals are calculated from demo records, not historical business performance.</p></section></div><div class="module-grid">${[['Sales report','Orders, status, items and merchant delivery fees.','export-orders','orders'],['Inventory report','Sample quantities and availability by product.','export-products','box'],['Settlement ledger','Online payable and COD receivable kept separate.','export-ledger','wallet']].map(([h,p,a,i])=>`<button class="module-tile" data-act="${a}">${icon(i)}<div><h3>${h}</h3><p>${p}</p></div>${icon('export','chev')}</button>`).join('')}</div>`}
function supportPage(role){const own=role==='merchant';const relevant=state.tickets.filter(t=>!own||state.orders.find(o=>o.id===t.order)?.merchant===MERCHANT);const selected=relevant.find(t=>t.id===UI.ticket)||relevant[0];return `${titleBar('Support inbox','One place for the order, merchant and customer context.',button('New case','new-ticket',{},'','plus'))}${!selected?empty('No support cases','Create a demo case to explore this workflow.',button('Create case','new-ticket',{},'secondary')):`<section class="card inbox"><aside class="case-list">${relevant.map(t=>`<button class="${t.id===selected.id?'active':''}" data-act="select-ticket" data-id="${t.id}"><div class="row between"><strong class="tiny">${t.id}</strong>${statusTag(t.status)}</div><h3 class="mt12">${esc(t.subject)}</h3><p>${t.order} · ${esc(t.category)}</p></button>`).join('')}</aside><section class="case-thread"><div class="row between"><div><h3>${esc(selected.subject)}</h3><p class="tiny mt12">${selected.order} · ${selected.id}</p></div>${button('View order','order-detail',{id:selected.order},'secondary small','eye')}</div><div class="divider" style="margin:0"></div>${selected.messages.map(m=>`<div class="message ${m.from==='Internal note'?'reply':''}"><small>${esc(m.from)}</small>${esc(m.text)}</div>`).join('')}<form class="message-form" data-form="support-note" data-id="${selected.id}"><label class="sr-only" for="case-note">Internal note</label><input id="case-note" name="message" required maxlength="500" placeholder="Add an internal demo note…"><button class="btn" type="submit">Add note</button></form><div class="row between"><span class="tiny">Internal notes do not message the customer.</span>${button(selected.status==='Resolved'?'Reopen case':'Resolve case','ticket-status',{id:selected.id},'quiet small','checkcircle')}</div></section></section>`}`}

function merchantProducts(){return `${titleBar('Products','Manage your shop’s catalogue, prices and availability.',goButton('Add product','merchant/create-product','','plus'))}${table({rows:state.products.filter(p=>p.merchant===MERCHANT),title:'Product catalogue',search:'Search product, SKU or category…',tabs:['All','Published','Awaiting review','Unavailable'],filter:(p,t)=>t==='Unavailable'?!p.active:p.review===t,columns:[{label:'Product',sort:'name',render:p=>`<div class="row"><span class="cell-thumb">${packshot(p,true)}</span><div><strong>${esc(p.name)}</strong><span class="cell-sub">${p.sku} · ${esc(p.unit)}</span></div></div>`},{label:'Category',key:'category'},{label:'Selling price',num:true,sort:'price',render:p=>money(p.price)},{label:'Stock',num:true,sort:'stock',render:p=>`<strong style="${p.stock<p.reorder?'color:var(--warning)':''}">${p.stock}</strong>`},{label:'Listing',render:p=>statusTag(p.review)},{label:'Available',render:p=>`<input aria-label="Availability of ${esc(p.name)}" class="switch" type="checkbox" data-change="product-availability" data-id="${p.id}" ${p.active?'checked':''} ${p.review!=='Published'?'disabled':''}>`},{label:'Action',render:p=>button('Edit','edit-product',{id:p.id},'quiet small','edit')}]})}`}
function productForm(product=null,dialog=false){let p=product||{name:'',sku:'',category:'Pantry',unit:'1 pack',price:'',stock:'',reorder:10};return `<form data-form="product" data-id="${product?.id||''}"><div class="form-grid">${field('Product name','name',p.name,'text','required maxlength="70"')}${field('SKU','sku',p.sku,'text','required maxlength="30"')}${selectField('Category','category',state.categories,p.category)}${field('Pack size / unit','unit',p.unit,'text','required maxlength="30"')}${field('Selling price (PKR)','price',p.price,'number','required min="1" max="1000000" step="1"')}${field('Available quantity','stock',p.stock,'number','required min="0" max="100000" step="1"')}${field('Reorder alert quantity','reorder',p.reorder,'number','required min="0" max="10000" step="1"')}${field('Expiry date (optional)','expiry',p.expiry||'','date')}</div><div class="mt">${notice('New products enter catalogue review and stay hidden from shoppers until approved. Artwork here remains an illustrative placeholder.','gray')}</div><div class="row end mt">${button('Cancel','go',{route:'merchant/products'},'secondary')}<button type="submit" class="btn">${icon('checkcircle','sm')}${product?'Save changes':'Submit for review'}</button></div></form>`}
function merchantStock(){let products=state.products.filter(p=>p.merchant===MERCHANT),low=products.filter(p=>p.stock<p.reorder),expiry=products.filter(p=>p.expiry);return `${titleBar('Stock & expiry','Know what is available before accepting an order.',button('Adjust stock','stock-adjust',{},'','plus'))}<div class="metrics">${metric('Tracked products',products.length,'box','Your own shop inventory')}${metric('Units available',products.reduce((s,p)=>s+p.stock,0),'activity','Pack quantities, not weight','blue')}${metric('Below reorder level',low.length,'alert','Action recommended','amber')}${metric('Dated products',expiry.length,'calendar','Expiry dates recorded','ink')}</div>${table({rows:products,title:'Stock levels',search:'Search SKU or product…',tabs:['All','Low stock','Dated products'],filter:(p,t)=>t==='Low stock'?p.stock<p.reorder:!!p.expiry,columns:[{label:'Product',sort:'name',render:p=>`<strong>${esc(p.name)}</strong><span class="cell-sub">${p.sku} · ${esc(p.unit)}</span>`},{label:'Available',num:true,sort:'stock',render:p=>`<strong>${p.stock}</strong>`},{label:'Reorder at',key:'reorder',num:true},{label:'Expiry',render:p=>p.expiry||'Not recorded'},{label:'Stock status',render:p=>p.stock<p.reorder?tag('Low stock','amber'):tag('In stock')},{label:'Action',render:p=>button('Adjust','stock-adjust',{id:p.id},'quiet small','edit')}]})}<section class="card pad mt"><h3 class="mb12">Recent adjustments</h3>${state.stockLog.slice(0,4).map(l=>`<div class="list-row"><span class="avatar">${icon('activity')}</span><div class="grow"><strong class="small">${esc(l.product)}</strong><p>${esc(l.reason)} · ${esc(l.time)}</p></div><strong class="small num">${l.before} → ${l.after}</strong></div>`).join('')}</section>`}
function merchantOrders(){let orders=ownOrders();return `${titleBar('Online orders','Accept, prepare and assign delivery to your own riders.',button(UI.orderMode==='board'?'Table view':'Board view','orders-mode',{},'secondary',UI.orderMode==='board'?'orders':'grid'))}${UI.orderMode==='board'?`<div class="kanban">${['new','preparing','ready'].map(s=>`<section class="kanban-col"><div class="kanban-head"><span>${STATUS[s]}</span>${tag(orders.filter(o=>o.status===s).length,'gray')}</div>${orders.filter(o=>o.status===s).map(o=>`<article class="order-ticket"><div class="row between"><h3>#${o.id}</h3>${tag(o.payment,o.payment==='COD'?'amber':'blue')}</div><p>${o.customerName}<br>${o.items.reduce((n,i)=>n+i.qty,0)} items · ${o.area}</p>${button('Open order','order-detail',{id:o.id},'secondary full','arrow')}<div class="ticket-foot"><span>Today · ${o.time}</span><strong>${money(o.total)}</strong></div></article>`).join('')||'<p class="small muted" style="padding:15px">No orders in this stage.</p>'}</section>`).join('')}</div>`:orderTable(orders,'merchant')}`}
function merchantPurchases(){return `${titleBar('Purchase orders','Optional retail-tool concept · supplier purchasing for your shop.',button('New purchase order','new-purchase',{},'','plus'))}<div class="mb">${notice('Proposed extension inspired by retail POS modules. These are merchant-owned purchases, not SirfBazar warehouse replenishment.','amber')}</div>${table({rows:state.purchases,title:'Purchasing',search:'Search supplier or purchase order…',tabs:['All','Draft','Received'],filter:(p,t)=>p.status===t,columns:[{label:'Purchase order',render:p=>`<strong>${p.id}</strong><span class="cell-sub">${p.date}</span>`},{label:'Supplier',key:'supplier'},{label:'Products',key:'items'},{label:'Cost',num:true,render:p=>money(p.amount)},{label:'Status',render:p=>statusTag(p.status)},{label:'Action',render:p=>button('View','generic-detail',{type:'purchases',id:p.id},'quiet small','eye')}]})}`}
function merchantSuppliers(){return `${titleBar('Suppliers','Optional shop-level supplier directory. No platform procurement.',button('Add supplier','new-supplier',{},'','plus'))}<div class="mb">${notice('Proposed retail-tool module. Supplier entries in this design are fictional.','amber')}</div>${table({rows:state.suppliers,title:'Supplier directory',search:'Search supplier…',columns:[{label:'Supplier',render:s=>`<div class="row"><span class="avatar">${s.name.charAt(0)}</span><div><strong>${esc(s.name)}</strong><span class="cell-sub">${s.id} · Shop-owned relationship</span></div></div>`},{label:'Supplies',key:'category'},{label:'Lead time (demo)',key:'lead'},{label:'Status',render:s=>tag(s.status)},{label:'Action',render:s=>button('View','generic-detail',{type:'suppliers',id:s.id},'quiet small','eye')}]})}`}
function merchantPOS(){let products=state.products.filter(p=>p.merchant===MERCHANT&&p.active&&(UI.category==='All'||p.category===UI.category)&&p.name.toLowerCase().includes(UI.query.toLowerCase()));let items=Object.entries(state.pos).filter(([,q])=>q>0).map(([id,qty])=>({...getProduct(id),qty}));let subtotal=items.reduce((n,p)=>n+p.price*p.qty,0);return `${titleBar('In-store point of sale','Proposed merchant retail extension · separate from marketplace orders.',button('Clear bill','clear-pos',{},'secondary','refresh'))}<div class="mb">${notice('Optional concept. In-store sales do not enter rider dispatch or marketplace commission totals. No payment terminal is connected.','amber')}</div><div class="pos-layout"><section>${searchField('Search products for this bill…','pos-search')}<div class="chips mt12 mb12">${['All','Dairy & eggs','Bakery','Pantry','Household'].map(c=>`<button class="chip ${UI.category===c?'active':''}" data-act="pos-category" data-category="${esc(c)}">${c}</button>`).join('')}</div><div class="pos-grid">${products.map(p=>productCard(p,'pos')).join('')}</div></section><aside class="card pos-bill"><div class="card-header"><div><h2>Current bill</h2><p>Walk-in customer · local demo</p></div>${tag('In-store','gray')}</div><div class="pad"><div class="basket-lines">${items.length?basketRows(items,true,'pos'):empty('Start a bill','Select products from the grid.')}</div><div class="divider"></div>${subtotalLines({subtotal,fee:0,total:subtotal}).replace('Merchant delivery','Delivery (not applicable)')}<div class="mt">${button('Complete cash sale','pos-checkout',{},'full','cash')}</div><p class="tiny mt12">Creates a local receipt and updates demo stock only.</p></div></aside></div>`}
function merchantInvoices(){let rows=[...ownOrders().filter(o=>o.status==='delivered').map(o=>({id:'INV-'+o.id.slice(3),order:o.id,name:o.customerName,total:o.total,channel:'Marketplace',status:'Delivered',payment:o.payment})),...state.posReceipts.map(p=>({...p,name:'Walk-in customer',channel:'In-store POS',status:'Completed',payment:'Cash'}))];return `${titleBar('Invoices','Marketplace order statements and in-store demo receipts.')}${table({rows,title:'Sales documents',search:'Search invoice…',tabs:['All','Marketplace','In-store POS'],filter:(r,t)=>r.channel===t,columns:[{label:'Invoice',key:'id'},{label:'Customer',key:'name'},{label:'Channel',render:r=>tag(r.channel,r.channel==='In-store POS'?'amber':'')},{label:'Total',num:true,render:r=>money(r.total)},{label:'Payment',key:'payment'},{label:'Action',render:r=>button('Statement','invoice',{id:r.id,order:r.order||''},'quiet small','document')}]})}<div class="mt">${notice('These are demonstration statements, not tax invoices or evidence of payment collection.','gray')}</div>`}
function returnsPage(role){let rows=role==='merchant'?state.returns.filter(r=>r.merchant===MERCHANT):state.returns;return `${titleBar(role==='merchant'?'Returns':'Returns & disputes','Review the item issue before recording any resolution.')}<div class="mb">${notice('Resolving a demo case does not refund a customer, change inventory or reverse an order. Those production workflows require separate validation.','gray')}</div>${table({rows,title:'Return requests',search:'Search return or order…',tabs:['All','Needs review','Resolved'],filter:(r,t)=>r.status===t,columns:[{label:'Request',key:'id'},{label:'Order',render:r=>`<button class="cell-title button" data-act="order-detail" data-id="${r.order}">${r.order}</button>`},{label:'Reason',key:'reason'},{label:'Claimed value',num:true,render:r=>money(r.amount)},{label:'Status',render:r=>statusTag(r.status)},{label:'Action',render:r=>button('Review','generic-detail',{type:'returns',id:r.id},'quiet small','eye')}]})}`}
function couponsPage(role){const rows=role==='merchant'?state.coupons.filter(c=>c.scope.startsWith('Merchant')):state.coupons;return `${titleBar(role==='merchant'?'Coupons':'Promotions','Clear eligibility, funding and state for every campaign.',button('Create draft','new-coupon',{},'','plus'))}<div class="mb">${notice('Offers and budgets are illustrative. Saving a draft does not launch a real promotion or alter checkout totals.','gray')}</div>${table({rows,title:'Campaigns',search:'Search coupon or campaign…',tabs:['All','Active','Draft','Paused'],filter:(c,t)=>c.status===t,columns:[{label:'Campaign',render:c=>`<strong>${esc(c.name)}</strong><span class="cell-sub">${esc(c.id)}</span>`},{label:'Discount',num:true,render:c=>money(c.discount)},{label:'Minimum items value',num:true,render:c=>money(c.min)},{label:'Funding',key:'scope'},{label:'Status',render:c=>statusTag(c.status)},{label:'Action',render:c=>button('Review','coupon-detail',{id:c.id},'quiet small','eye')}]})}`}
function merchantTeam(){return `${titleBar('Team & permissions','Access designed around the responsibilities in your shop.',button('Invite team member','invite-team',{},'','plus'))}<div class="mb">${notice('This is a permissions design, not working access control. The production server must enforce merchant scope.','gray','shield')}</div>${table({rows:state.team,title:'Shop team',search:'Search team member…',columns:[{label:'Team member',key:'name'},{label:'Role',key:'role'},{label:'Scope',key:'scope'},{label:'Status',render:t=>statusTag(t.status)}]})}<section class="card pad mt"><h3 class="mb12">Suggested role responsibilities</h3><div class="table-wrap"><table class="data-table roles-matrix"><thead><tr><th>Capability</th><th>Owner</th><th>Order manager</th><th>Catalogue editor</th></tr></thead><tbody>${[['Orders & dispatch','Manage','Manage','No access'],['Products & stock','Manage','View','Manage'],['Settlements & bank details','Manage','No access','No access'],['Staff invitations','Manage','No access','No access']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function merchantSettings(){return `${titleBar('Shop settings','Store availability, fulfilment and profile details.')}<div class="two-col"><section class="card pad"><form data-form="merchant-settings"><h3 class="mb">Shop profile</h3><div class="form-grid">${field('Shop name','name',getMerchant().name,'text','required maxlength="70"')}${selectField('Service area','area',['Gulberg','Model Town','Johar Town','DHA'],getMerchant().area)}${field('Demo delivery charge (PKR)','fee',getMerchant().fee,'number','required min="0" max="10000"')}${field('Demo minimum order (PKR)','min',getMerchant().min,'number','required min="0" max="100000"')}</div><div class="divider"></div><h3 class="mb12">Order availability</h3><label class="checkline"><input class="switch" type="checkbox" name="open" ${state.shopOpen?'checked':''}><span><strong>Accept new demo orders</strong><small>Pausing does not cancel existing orders.</small></span></label><div class="mt"><button class="btn" type="submit">Save demo settings</button></div></form></section><aside class="stack"><section class="card pad"><h3 class="mb12">Your delivery model</h3><p class="small muted">Your shop prepares each order and assigns its own riders. SirfBazar does not manage a central delivery fleet.</p>${goButton('Manage my riders','merchant/riders','quiet small','arrow')}</section><section class="card pad"><h3 class="mb12">Brand identity</h3>${brand(true)}<p class="tiny mt12">The basket, green and single-line Urdu slogan stay consistent with all five products.</p></section></aside></div>`}
function renderMerchant(){let b;switch(UI.page){case'dashboard':b=opsOverview('merchant');break;case'orders':b=merchantOrders();break;case'products':b=merchantProducts();break;case'create-product':b=titleBar('Add a product','Give your shoppers clear product details and a reliable price.')+`<div class="two-col"><section class="card pad">${productForm()}</section><aside class="card pad" style="height:max-content"><h3 class="mb12">Product information checklist</h3>${['Clear product name','Exact pack size and unit','Current selling price','Available pack quantity','Accurate photograph in production'].map(t=>`<div class="list-row">${icon('checkcircle','sm')}<span class="small">${t}</span></div>`).join('')}</aside></div>`;break;case'categories':b=categoriesPage('merchant');break;case'stock':b=merchantStock();break;case'purchases':b=merchantPurchases();break;case'suppliers':b=merchantSuppliers();break;case'pos':b=merchantPOS();break;case'invoices':b=merchantInvoices();break;case'returns':b=returnsPage('merchant');break;case'riders':b=ridersTable('merchant');break;case'customers':b=peopleTable('merchant');break;case'coupons':b=couponsPage('merchant');break;case'settlements':b=settlementsPage('merchant');break;case'reports':b=reportsPage('merchant');break;case'team':b=merchantTeam();break;case'settings':b=merchantSettings();break;case'support':b=supportPage('merchant');break;default:b=opsOverview('merchant')}return opsShell('merchant',b)}

function riderTaskCard(o){let m=getMerchant(o.merchant);return `<article class="delivery-ticket"><div class="ticket-head"><strong class="small">#${o.id}</strong>${statusTag(o.status)}</div><div class="ticket-body"><div class="route-stop"><span class="stop-marker">1</span><div><h4>${esc(m.name)}</h4><p>Pickup · ${esc(m.area)}, Lahore</p></div></div><div class="route-stop"><span class="stop-marker">2</span><div><h4>${esc(o.customerName)}</h4><p>Drop-off · ${esc(o.area)} demo area</p></div></div><div class="row between mb12 mt12"><span class="tiny">${o.items.reduce((s,p)=>s+p.qty,0)} items · ${o.payment}</span><strong class="small">${o.payment==='COD'?'Collect '+money(o.total):'Already paid · demo'}</strong></div>${button(o.status==='ready'?'Start pickup':'Continue delivery','rider-order',{id:o.id},'full','arrow')}</div></article>`}
function riderHome(){let assignments=riderOrders().filter(o=>['ready','picked','arrived'].includes(o.status)),done=riderOrders().filter(o=>o.status==='delivered'),cash=done.filter(o=>o.payment==='COD'&&o.cashCollected&&!o.cashRemitted).reduce((s,o)=>s+o.total,0);return `<main class="phone-main"><div class="row between"><span class="tag gray">${icon('shop','sm')}Gulberg General Store</span><label class="row gap8"><span class="tiny">${state.riderOnline?'Online':'Offline'}</span><input class="switch" type="checkbox" aria-label="Rider availability" data-change="rider-online" ${state.riderOnline?'checked':''}></label></div><div class="rider-greeting"><div><h1>Hello, Hamza.</h1><p>${assignments.length?'Your next delivery is ready for you.':'You’re all caught up for now.'}</p></div><div class="avatar ink">H</div></div><div class="rider-stats"><div class="rider-stat"><strong>${assignments.length}</strong><span>Assigned</span></div><div class="rider-stat"><strong>${done.length}</strong><span>Delivered</span></div><div class="rider-stat"><strong>${money(cash)}</strong><span>Cash with you</span></div></div>${!state.riderOnline?notice('You are offline for new pickups. Finish any delivery already in progress.','amber'):notice('Only your shop’s assigned deliveries appear here.','','rider')}${section('Your assignments',tag('Demo snapshot','gray'))}${assignments.length?assignments.map(riderTaskCard).join(''):empty('No assigned deliveries','Ask the merchant to mark an order ready and assign you.',goButton('Open merchant demo','merchant/orders','secondary'))}<p class="tiny mt12">No location is being collected. Tracking is illustrative.</p></main>`}
function riderPickup(){const o=currentRiderOrder();if(!o||o.status!=='ready')return `<main class="phone-main padded">${empty('No pickup to confirm',o&&['picked','arrived'].includes(o.status)?'This order has already been picked up. Continue to the delivery details.':'The merchant must prepare and assign an order before pickup.',goButton(o&&['picked','arrived'].includes(o.status)?'Continue delivery':'Back to assignments','rider/'+(o&&['picked','arrived'].includes(o.status)?'delivery':'home'),'','arrow'))}</main>`;return `<main class="phone-main padded">${notice('#'+o.id+' · Assigned by '+esc(getMerchant(o.merchant).name),'','shop')}<div class="card pad mt"><h2 class="mb12">Check the order.</h2><p class="small muted mb">Confirm every item before leaving the shop.</p><form data-form="pickup" data-id="${o.id}"><div class="stack">${o.items.map((p,i)=>`<label class="checkline"><input name="item-${i}" type="checkbox" required><span class="grow"><strong>${esc(p.name)}</strong><small>${p.qty} × ${esc(p.unit)}</small></span><strong class="small">${p.qty}</strong></label>`).join('')}<label class="checkline"><input type="checkbox" name="packed" required><span><strong>Order is packed and ready</strong><small>Items match the merchant’s handover.</small></span></label></div><div class="divider"></div><div class="row between mb"><span class="muted small">Customer payment</span><strong>${o.payment==='COD'?'Collect '+money(o.total):'Online · demo paid'}</strong></div><button type="submit" class="btn full">${icon('checkcircle','sm')}Confirm pickup</button></form></div><div class="mt">${button('Report an item issue','rider-issue',{id:o.id},'secondary full','alert')}</div></main>`}
function riderDelivery(){const o=currentRiderOrder();if(!o||!['ready','picked','arrived'].includes(o.status))return `<main class="phone-main padded">${empty('No active delivery','Completed orders are in your history.',goButton('View assignments','rider/home','','arrow'))}</main>`;return `<main class="phone-main padded"><div class="row between mb12"><strong>#${o.id}</strong>${statusTag(o.status)}</div>${mapPanel()}<div class="card pad mt"><span class="eyebrow">Deliver to</span><h2 class="mt12">${esc(o.customerName)}</h2><p class="small muted mt12">${esc(o.area)}, Lahore<br>Demo destination · no real street address</p><div class="notice gray mt12">${icon('note')}<div>${esc(o.note||'Please call when you arrive at the entrance.')}</div></div><div class="row mt">${button('Route preview','route-preview',{},'secondary grow','navigation')}${button('Contact','contact-preview',{},'secondary grow','call')}</div></div><div class="card pad mt"><div class="row between"><div><h3>${o.payment==='COD'?'Cash to collect':'Online payment'}</h3><p class="tiny mt12">${o.payment==='COD'?'Hand over to your merchant after delivery.':'No cash collection required in this demo.'}</p></div><strong class="money">${o.payment==='COD'?money(o.total):money(0)}</strong></div></div><div class="mt">${o.status==='ready'?goButton('Complete pickup first','rider/pickup','full','box'):o.status==='picked'?button('I have arrived','arrived',{id:o.id},'full','pin'):goButton('Complete delivery','rider/proof','full','checkcircle')}</div><div class="mt12">${button('There is a delivery issue','rider-issue',{id:o.id},'quiet full','support')}</div></main>`}
function riderProof(){const o=currentRiderOrder();if(!o||o.status!=='arrived')return `<main class="phone-main padded">${empty('Confirm arrival first','The order must be picked up and marked as arrived before completion.',goButton('Delivery details','rider/delivery','','arrow'))}</main>`;return `<main class="phone-main padded"><div class="track-banner"><span class="avatar">${icon('checkcircle')}</span><div><h2>One final check.</h2><p>Complete #${o.id} with the customer.</p></div></div><section class="card pad mt"><form data-form="delivery-proof" data-id="${o.id}"><h3>Delivery confirmation code</h3><p class="small muted mt12 mb">Ask the customer for their delivery code. For this demo, enter <strong>1234</strong>.</p><label class="field">4-digit demo code<input class="proof-code" inputmode="numeric" name="code" pattern="[0-9]{4}" maxlength="4" required placeholder="••••" autocomplete="off"></label><label class="checkline mt"><input type="checkbox" name="handed" required><span><strong>Order handed to the customer</strong><small>Do not confirm a failed or unattended delivery.</small></span></label>${o.payment==='COD'?`<label class="checkline mt12"><input type="checkbox" name="cash" required><span><strong>${money(o.total)} cash collected</strong><small>This becomes cash owed to your merchant, not rider earnings.</small></span></label>`:notice('Online-paid demo order. Do not collect cash.','gray')}<div class="mt"><button type="submit" class="btn full">${icon('checkcircle','sm')}Confirm demo delivery</button></div></form></section><p class="tiny mt12">Demo verification only. No real OTP or proof service is connected.</p></main>`}
function riderHistory(){let orders=riderOrders().filter(o=>o.status==='delivered');return `<main class="phone-main padded">${notice('Completed deliveries assigned to your rider profile.','gray')}<div class="mt">${orders.map(o=>`<section class="card pad mb12"><div class="row between"><strong>#${o.id}</strong>${tag('Delivered')}</div><h3 class="mt12">${esc(o.customerName)}</h3><p class="tiny mt12">${getMerchant(o.merchant).name} · ${o.area}</p><div class="row between mt12"><span class="small">${o.payment==='COD'?'COD collected':'Online paid'}</span><strong class="small">${money(o.total)}</strong></div>${button('View delivery','rider-history-detail',{id:o.id},'quiet small','eye')}</section>`).join('')||empty('Your completed deliveries will appear here.','Complete an assigned order to see its delivery record.')}</div></main>`}
function riderCash(){let due=riderOrders().filter(o=>o.status==='delivered'&&o.payment==='COD'&&o.cashCollected&&!o.cashRemitted);let total=due.reduce((s,o)=>s+o.total,0);return `<main class="phone-main padded"><div class="rider-cash"><p>Cash held for Gulberg General Store</p><strong>${money(total)}</strong><p>This is merchant money, not your earnings.</p></div>${notice('Request a handover when you return to the shop. The merchant confirms receipt separately.','gray','wallet')}<section class="card pad mt"><h3 class="mb12">Unsettled cash deliveries</h3>${due.map(o=>`<div class="list-row"><div class="grow"><strong class="small">#${o.id}</strong><p>${o.customerName}</p></div><strong class="small">${money(o.total)}</strong>${o.handoverRequested?tag('Requested','blue'):''}</div>`).join('')||empty('All cash accounted for','There are no outstanding COD collections in this demo.')}<div class="mt">${due.length?button(due.every(o=>o.handoverRequested)?'Handover requested':'Request cash handover','request-handover',{},'full','wallet'):goButton('Back to assignments','rider/home','secondary full')}</div></section><p class="tiny mt12">A request is not a completed handover. The balance clears only after merchant confirmation.</p></main>`}
function riderSupport(){let o=currentRiderOrder();return `<main class="phone-main padded"><h2 class="mb12">Let’s sort it out.</h2><p class="small muted mb">Keep the merchant informed about anything affecting a delivery.</p><div class="stack">${[['Customer is unavailable','Record an attempted delivery without marking it complete.','call'],['Problem with an item','Let the shop know before confirming handover.','box'],['Need to return to the shop','Record a return request for merchant review.','refresh']].map(([h,p,i])=>`<button class="help-choice" data-act="rider-issue" data-id="${o?.id||''}" data-subject="${h}"><div class="row"><span class="avatar">${icon(i)}</span><div><strong>${h}</strong><p>${p}</p></div></div></button>`).join('')}</div><div class="card pad mt"><h3>Contact your merchant</h3><p class="small muted mt12">Gulberg General Store · shop owner</p>${button('Contact preview','contact-preview',{},'secondary full mt','call')}</div></main>`}
function riderAccount(){return `<main class="phone-main padded"><div class="account-hero"><div class="row"><span class="avatar ink">H</span><div><h1>Hamza (demo)</h1><p>Rider ID ${RIDER}</p></div></div></div><section class="card pad"><div class="list-row"><span class="avatar">${icon('shop')}</span><div><strong class="small">Gulberg General Store</strong><p>Your merchant · ${MERCHANT}</p></div></div><div class="list-row"><span class="avatar">${icon('call')}</span><div><strong class="small">+92 300 ••• ••••</strong><p>Masked fictional contact</p></div></div><div class="list-row"><span class="grow"><strong class="small">Available for pickups</strong><p class="tiny mt12">Your shift status in the demo.</p></span><input aria-label="Rider availability" class="switch" type="checkbox" data-change="rider-online" ${state.riderOnline?'checked':''}></div><div class="list-row"><span class="grow"><strong class="small">Location permission</strong><p class="tiny mt12">Not requested or collected in this prototype.</p></span>${tag('Not connected','gray')}</div>${goButton('Help & support','rider/support','quiet full','support')}</section><div class="mt">${notice('In production, rider access requires a merchant-linked account. Switching apps here is only a design-preview control.','gray','shield')}</div></main>`}
function renderRider(){let f={home:riderHome,pickup:riderPickup,delivery:riderDelivery,proof:riderProof,history:riderHistory,cash:riderCash,support:riderSupport,account:riderAccount}[UI.page]||riderHome;return phoneShell('rider',f(),NAV.rider.find(x=>x[0]===UI.page)?.[1]||'Rider')}

function adminMerchants(){return `${titleBar('Merchants','Review shop applications, availability and fulfilment ownership.',button('New application','new-merchant',{},'','plus'))}<div class="metrics">${metric('Total shops',state.merchants.length,'shop','All sample merchant profiles')}${metric('Active shops',state.merchants.filter(m=>m.status==='Active').length,'checkcircle','Approved in this demo','blue')}${metric('Pending review',state.merchants.filter(m=>m.status==='Pending review').length,'clock','Applications to review','amber')}${metric('Paused',state.merchants.filter(m=>m.status==='Paused').length,'pause','Not accepting new orders','ink')}</div>${table({rows:state.merchants,title:'Merchant directory',search:'Search merchant or area…',tabs:['All','Active','Pending review','Paused'],filter:(m,t)=>m.status===t,columns:[{label:'Merchant',sort:'name',render:m=>`<div class="row"><span class="avatar">${m.initials}</span><div><strong>${esc(m.name)}</strong><span class="cell-sub">${m.id} · ${esc(m.category)}</span></div></div>`},{label:'Service area',key:'area'},{label:'Merchant riders',num:true,render:m=>state.riders.filter(r=>r.merchant===m.id).length},{label:'Orders',num:true,render:m=>state.orders.filter(o=>o.merchant===m.id).length},{label:'Status',render:m=>statusTag(m.status)},{label:'Action',render:m=>button(m.status==='Pending review'?'Review':'View shop','merchant-detail',{id:m.id},'quiet small','eye')}]})}`}
function adminCatalogue(){return `${titleBar('Catalogue moderation','Keep merchant listings clear, accurate and ready for customers.')}<div class="mb">${notice('Stock belongs to the merchant. Admin reviews listing quality rather than operating a warehouse.','gray','box')}</div>${table({rows:state.products,title:'Marketplace listings',search:'Search product, SKU or merchant…',tabs:['All','Awaiting review','Published','Changes requested'],filter:(p,t)=>p.review===t,columns:[{label:'Product',sort:'name',render:p=>`<div class="row"><span class="cell-thumb">${packshot(p,true)}</span><div><strong>${esc(p.name)}</strong><span class="cell-sub">${p.sku} · ${esc(p.unit)}</span></div></div>`},{label:'Merchant',render:p=>getMerchant(p.merchant).name},{label:'Category',key:'category'},{label:'Listed price',num:true,render:p=>money(p.price)},{label:'Review state',render:p=>statusTag(p.review)},{label:'Action',render:p=>button('Review listing','listing-review',{id:p.id},'quiet small','eye')}]})}`}
function adminCommission(){return `${titleBar('Commission rules','Design configurable business terms without hiding their assumptions.')}<div class="two-col"><section class="card pad"><h3 class="mb12">Default merchandise commission</h3>${notice('No commercial commission has been approved. The value below is an illustrative rule for the prototype ledger.','amber')}<form data-form="commission" class="mt"><div class="form-grid">${field('Demo rate (%)','rate',state.commission,'number','required min="0" max="30" step="0.1"')}${selectField('Calculation basis','basis',['Delivered merchandise subtotal'])}</div><div class="divider"></div><div class="summary-lines"><div><span class="muted">Delivery charges</span><strong>Excluded</strong></div><div><span class="muted">COD commission</span><strong>Separate receivable</strong></div><div><span class="muted">Online commission</span><strong>Deducted in demo ledger</strong></div></div><button class="btn mt" type="submit">Save demo rule</button></form></section><aside class="stack"><section class="card pad"><h3 class="mb12">Audit before rollout</h3><p class="small muted">A production rule needs contract terms, effective dates, overrides, tax treatment and versioned order-level snapshots.</p></section><section class="card pad"><h3 class="mb12">Connected module</h3><p class="small muted">Changing the sample rate recalculates this prototype’s illustrative ledger.</p>${goButton('View settlements','admin/settlements','quiet small','arrow')}</section></aside></div>`}
function adminAreas(){let areas=[...new Set(state.merchants.map(m=>m.area))].map((name,i)=>({id:'AREA-'+i,name,shops:state.merchants.filter(m=>m.area===name&&m.status==='Active').length,orders:state.orders.filter(o=>o.area===name).length,status:state.merchants.some(m=>m.area===name&&m.status==='Active')?'Serviceable demo':'No active shops'}));return `${titleBar('Service areas','Coverage comes from participating merchants, not a platform warehouse network.')}<div class="two-col"><section>${table({rows:areas,title:'Neighbourhood coverage',search:'Search neighbourhood…',columns:[{label:'Neighbourhood',key:'name'},{label:'Active shops',num:true,key:'shops'},{label:'Orders',num:true,key:'orders'},{label:'Coverage',render:a=>tag(a.status,a.shops?'':'gray')}]})}</section><aside class="stack">${mapPanel()}${notice('This is a schematic only. Delivery polygons, travel estimates and capacity are not calculated.','gray','map')}</aside></div>`}
function adminCMS(){return `${titleBar('Content manager','Homepage campaigns, help content and the customer experience.',button('Create content draft','new-content',{},'','plus'))}<div class="mb">${notice('The identity stays locked: supplied basket logo, #009966 green and the exact single-line Urdu slogan. Draft edits here do not publish a live website.','gray')}</div>${table({rows:state.cms,title:'Content library',search:'Search content…',tabs:['All','Draft','Published'],filter:(c,t)=>c.status===t,columns:[{label:'Content',render:c=>`<strong>${esc(c.title)}</strong><span class="cell-sub">${c.id}</span>`},{label:'Placement',key:'type'},{label:'State',render:c=>statusTag(c.status)},{label:'Action',render:c=>button('Edit draft','edit-content',{id:c.id},'quiet small','edit')}]})}<section class="card pad mt"><div class="row between wrap"><div><h3>Brand signature</h3><p class="small muted mt12">Use approved assets, never regenerate the logo as text.</p></div>${brand(true)}</div></section>`}
function adminRoles(){const capabilities=['Read marketplace orders','Review merchant applications','Review catalogue listings','Review settlement statements','Prepare payout drafts','Manage support cases','Edit platform settings'];let roles=['Super admin','Operations','Finance','Support'];return `${titleBar('Roles & permissions','Separate marketplace oversight, operations, finance and customer support.',button('Invite administrator','invite-admin',{},'','plus'))}<div class="mb">${notice('Editable policy mockup only. Client-side checkboxes do not enforce access control. Production permissions require server-side enforcement and audit.','amber','shield')}</div><section class="card"><div class="card-header"><h2>Permission policy draft</h2>${tag('Not enforced','gray')}</div><form data-form="permissions"><div class="table-wrap"><table class="data-table roles-matrix"><thead><tr><th>Capability</th>${roles.map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${capabilities.map((c,i)=>`<tr><td><strong>${c}</strong></td>${roles.map((r,j)=>{const key='p'+i+j;const checked=state.permissionDraft?.[key]??(j===0||(j===1&&i<3)||(j===2&&(i===0||i===3||i===4))||(j===3&&(i===0||i===5)));return `<td><input type="checkbox" name="${key}" aria-label="${esc(r+' · '+c)}" ${checked?'checked':''} ${j===0?'disabled':''}></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="pad row end"><button class="btn" type="submit">Save local policy draft</button></div></form></section><section class="card pad mt"><h3 class="mb12">Administrator invitation drafts</h3>${(state.adminInvites||[]).map(a=>`<div class="list-row"><div class="grow"><strong class="small">${esc(a.name)}</strong><p>${esc(a.role)} · Draft only</p></div>${tag('Not sent','gray')}</div>`).join('')||'<p class="small muted">No invitation has been sent. Use “Invite administrator” to review the proposed flow.</p>'}</section>`}
function adminIntegrations(){const tiles=[['Google sign-in','Customer authentication at final checkout.','users'],['OTP provider','Provider-agnostic. No SMS API selected.','lock'],['Maps & tracking','Consent-based location and merchant-rider updates.','map'],['Online payments','Payment methods, webhooks and reconciliation.','wallet'],['Notifications','Order-state messages and delivery updates.','bell'],['Storage & catalogue','Product images and protected merchant documents.','box']];return `${titleBar('Integrations','Connection states and setup responsibilities, without exposing secrets.')}<div class="mb">${notice('No integration is connected. This design does not store API keys or secrets in the browser.','gray','shield')}</div><div class="module-grid">${tiles.map(([h,p,i])=>`<section class="card pad"><div class="row between mb"><span class="avatar">${icon(i)}</span>${tag('Not configured','gray')}</div><h3>${h}</h3><p class="small muted mt12">${p}</p><div class="mt">${button('View setup checklist','integration-checklist',{name:h},'secondary small','arrow')}</div></section>`).join('')}</div>`}
function adminAudit(){let rows=state.audit;return `${titleBar('Audit activity','Local actions taken while exploring this design suite.',button('Export activity','export-audit',{},'secondary','export'))}<div class="mb">${notice('This is a browser-local demo log, not a secure or immutable production audit trail.','gray','shield')}</div>${table({rows,title:'Recent activity',search:'Search action, role or record…',columns:[{label:'Time',key:'time'},{label:'Role',render:r=>ROLE_LABEL[r.actor]||r.actor},{label:'Action',key:'action'},{label:'Record',key:'entity'}]})}`}
function adminSettings(){return `${titleBar('Platform settings','Workspace preferences and fixed brand references.')}<div class="two-col"><section class="card pad"><form data-form="admin-settings"><h3 class="mb">Operational preferences</h3><div class="form-grid">${field('Acceptance alert threshold (minutes)','acceptanceAlert',state.settings.acceptanceAlert,'number','required min="1" max="60"')}${selectField('Currency','currency',['PKR · Pakistani rupee'])}${selectField('Timezone','timezone',['Asia/Karachi · PKT'])}${selectField('Default language','language',['English + Urdu brand slogan'])}</div><label class="checkline mt"><input class="switch" type="checkbox" name="notifications" ${state.settings.notifications?'checked':''}><span><strong>Show demo attention alerts</strong><small>Local preference only. No real notifications are sent.</small></span></label><div class="mt"><button type="submit" class="btn">Save preferences</button></div></form></section><aside class="stack"><section class="card pad"><h3 class="mb12">Locked brand identity</h3>${brand(true)}<div class="divider"></div><div class="row gap8"><span style="width:22px;height:22px;border-radius:6px;background:#009966"></span><strong class="small">#009966</strong><span class="tiny">Primary green</span></div><p class="tiny mt12">Plus Jakarta Sans · supplied basket vectors · single-line Urdu slogan.</p></section><section class="card pad"><h3 class="mb12">Prototype controls</h3><p class="small muted">Reset all five apps to the original fictional dataset.</p><div class="mt">${button('Reset demo data','reset-confirm',{},'secondary','refresh')}</div></section></aside></div>`}
function renderAdmin(){let b;switch(UI.page){case'dashboard':b=opsOverview('admin');break;case'orders':b=titleBar('All marketplace orders','Inspect the end-to-end journey across merchants.',button('Export orders','export-orders',{},'secondary','export'))+orderTable(state.orders,'admin');break;case'merchants':b=adminMerchants();break;case'catalogue':b=adminCatalogue();break;case'categories':b=categoriesPage('admin');break;case'customers':b=peopleTable('admin');break;case'riders':b=ridersTable('admin');break;case'returns':b=returnsPage('admin');break;case'settlements':b=settlementsPage('admin');break;case'commissions':b=adminCommission();break;case'promotions':b=couponsPage('admin');break;case'areas':b=adminAreas();break;case'reports':b=reportsPage('admin');break;case'cms':b=adminCMS();break;case'roles':b=adminRoles();break;case'integrations':b=adminIntegrations();break;case'audit':b=adminAudit();break;case'settings':b=adminSettings();break;case'support':b=supportPage('admin');break;default:b=opsOverview('admin')}return opsShell('admin',b)}

/* Controller for the five connected, browser-local design prototypes. */
const APP_INFO=[
 ['customer','01','Customer mobile app','Browse local shops, build a basket and sign in only at final checkout.','Mobile-first shopping'],
 ['website','02','Customer website','A spacious storefront with product discovery, checkout and order tracking.','Responsive storefront'],
 ['merchant','03','Merchant workspace','Orders, catalogue, stock and your riders, plus proposed retail POS tools.','Shop-scoped operations'],
 ['rider','04','Rider mobile app','Assignments, pickup checks, delivery confirmation and COD handover.','Merchant-owned delivery'],
 ['admin','05','Platform admin','Marketplace oversight, onboarding, moderation, settlements and permissions.','Platform-wide oversight']
];
function suiteRail(){return `<header class="suite-rail"><button class="suite-home" data-act="go" data-route="suite/home" aria-label="Open five-app design suite">${icon('grid')}<span>Product suite</span></button><nav class="suite-tabs" aria-label="Switch design prototype">${[['customer','Customer app'],['website','Website'],['merchant','Merchant'],['rider','Rider'],['admin','Admin']].map(([r,l])=>`<button class="${UI.role===r?'active':''}" data-act="go" data-route="${r}/${r==='admin'||r==='merchant'?'dashboard':'home'}" ${UI.role===r?'aria-current="page"':''}>${icon(ROLE_ICON[r])}<span>${l}</span></button>`).join('')}</nav><div class="suite-tools"><i class="demo-dot"></i><span>Interactive prototype</span><button data-act="guide">Guide</button><button data-act="reset-confirm">Reset</button></div></header>`}
function miniVisual(mobile){if(mobile)return `<div class="mini-phone"><div class="mini-main"><div class="mini-heading"></div><div class="mini-hero"></div><div class="mini-metrics"><i></i><i></i></div><div class="mini-lines"></div><div class="mini-lines"></div><div class="mini-metrics"><i></i><i></i></div></div></div>`;return `<div class="mini-window"><div class="mini-sidebar"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="mini-main"><div class="mini-heading"></div><div class="mini-metrics"><i></i><i></i><i></i></div><div class="mini-lines"></div><div class="mini-lines"></div><div class="mini-lines"></div><div class="mini-lines"></div></div></div>`}
function suiteLanding(){const count=Object.values(NAV).reduce((s,n)=>s+n.length,0);return `<main class="suite-landing"><div class="suite-intro"><div><div class="eyebrow">SirfBazar / Product design system / v4</div><h1>Five products.<br>One connected bazar.</h1><p>A complete set of role-specific prototypes. Built around your basket identity and green palette, with modular retail workflows inspired by DreamPOS.</p><div class="row wrap mt">${tag(count+' route views')}${tag('Shared demo order flow','gray')}${tag('No backend connected','gray')}</div></div><div class="suite-brand">${brand(true)}</div></div><div class="app-grid">${APP_INFO.map(([r,n,t,d,k])=>`<button class="app-card" data-act="go" data-route="${r}/${r==='admin'||r==='merchant'?'dashboard':'home'}"><div class="app-visual">${miniVisual(r==='customer'||r==='rider')}</div><div class="app-body"><span class="app-number">${n} / ${k}</span><h2>${t}</h2><p>${d}</p><div class="app-foot"><span>${NAV[r].length} route views</span><span class="row gap8">Open prototype ${icon('arrow','sm')}</span></div></div></button>`).join('')}<section class="app-card"><div class="app-visual" style="background:#edf2e7">${imgAsset('sirfbazar-basket.svg','','SirfBazar basket')}</div><div class="app-body"><span class="app-number">Design handoff</span><h2>See the whole journey.</h2><p>Place an order as a customer, prepare it as a merchant, deliver it as a rider and inspect it in admin.</p><div class="app-foot">${button('Open walkthrough','guide',{},'quiet small','arrow')}</div></div></section></div><section class="suite-guide"><div><h2>Retail modules, adapted to a marketplace.</h2><p>Products, stock, online orders, invoices, people, finance, reports and settings are grouped into operational modules. POS, supplier purchases and supplier management are marked as proposed merchant extensions. No dark stores or platform-owned fleet are implied.</p></div>${button('Module guide','module-guide',{},'secondary','document')}</section>${footer()}</main>`}
function go(route){const next='#'+route.replace(/^#\/?/,'');if(location.hash===next){readRoute(true)}else location.hash=next}
function readRoute(reset=true){let raw=location.hash.slice(1).replace(/^\//,'')||`${DEFAULT_ROLE}/${['merchant','admin'].includes(DEFAULT_ROLE)?'dashboard':'home'}`;const [path,query]=raw.split('?');let [role,page]=path.split('/');if(role!=='suite'&&!NAV[role])role='suite';if(role!=='suite'&&!NAV[role].some(n=>n[0]===page))page=['admin','merchant'].includes(role)?'dashboard':'home';const q=new URLSearchParams(query||'');UI.role=role;UI.page=page||'home';if(reset){UI.query='';UI.tab='All';UI.category=q.get('category')||'All';UI.sort='';UI.pageNumber=1;UI.menu=false;UI.selectedRows.clear()}
 if(q.has('shop')&&state.merchants.some(m=>m.id===q.get('shop')))UI.selectedShop=q.get('shop');if(q.has('product')&&state.products.some(p=>p.id===q.get('product')))UI.selectedProduct=q.get('product');if(q.has('order')&&state.orders.some(o=>o.id===q.get('order')))state.activeOrder=q.get('order');if(q.has('tab'))UI.tab=q.get('tab');if(document.getElementById('dialog').open)closeModal();render();window.scrollTo(0,0)}
function render(){CURRENT_TABLE=null;const app=document.getElementById('app');document.body.className='role-'+UI.role;const body=UI.role==='suite'?suiteLanding():['customer','website'].includes(UI.role)?renderCommerce():UI.role==='merchant'?renderMerchant():UI.role==='rider'?renderRider():renderAdmin();app.innerHTML=suiteRail()+body;document.title='SirfBazar · '+ROLE_LABEL[UI.role]+' · '+(NAV[UI.role]?.find(n=>n[0]===UI.page)?.[1]||'All five apps')}
function refreshKeepFocus(){const active=document.activeElement,id=active?.id,start=active?.selectionStart;render();if(id){let el=document.getElementById(id);if(el){el.focus();if(typeof start==='number'&&el.type!=='number')try{el.setSelectionRange(start,start)}catch{}}}}
function visibleOrder(id){const o=state.orders.find(o=>o.id===id);if(!o)return null;if(UI.role==='merchant'&&o.merchant!==MERCHANT)return null;if(['customer','website'].includes(UI.role)&&o.customer!==CUSTOMER)return null;if(UI.role==='rider'&&o.rider!==RIDER)return null;return o}
function orderDetail(id){const o=visibleOrder(id);if(!o){toast('That order is outside this demo role’s scope.');return}let m=getMerchant(o.merchant),own=UI.role==='merchant';let action='';if(own){if(o.status==='new')action=`<div class="row mt">${button('Decline order','decline-order',{id:o.id},'secondary grow','close')}${button('Accept order','order-advance',{id:o.id,next:'preparing'},'grow','checkcircle')}</div>`;if(o.status==='preparing')action=button('Mark ready for pickup','order-advance',{id:o.id,next:'ready'},'full mt','box');if(o.status==='ready')action=button(o.rider?'Review rider assignment':'Assign your rider','assign-rider',{id:o.id},'full mt','rider');if(['picked','arrived'].includes(o.status))action=notice('Delivery is in progress with your assigned rider. Merchant cannot mark it delivered here.','gray');}
 const items=o.items.map(p=>({...getProduct(p.productId),...p,id:p.productId}));modal('#'+o.id,`<div class="row between">${statusTag(o.status)}${tag(o.payment,o.payment==='COD'?'amber':'blue')}</div><div class="detail-grid"><div><small>Merchant</small><strong>${esc(m.name)}</strong></div><div><small>Customer</small><strong>${esc(o.customerName)}</strong></div><div><small>Area</small><strong>${esc(o.area)} · demo</strong></div><div><small>Merchant rider</small><strong>${esc(o.rider?state.riders.find(r=>r.id===o.rider)?.name:'Not assigned')}</strong></div></div><h3>Order items</h3>${basketRows(items,false)}<div class="divider"></div>${subtotalLines(o)}<div class="divider"></div><h3 class="mb">Order timeline</h3>${timeline(o)}${action?`<div class="mt">${action}</div>`:''}${['admin','merchant'].includes(UI.role)?`<div class="divider"></div><h3 class="mb12">Internal note</h3><form data-form="order-note" data-id="${o.id}"><label class="field"><span class="sr-only">Internal order note</span><textarea name="note" required maxlength="500" placeholder="Add context for your team…">${esc(o.internalNote||'')}</textarea></label><button class="btn secondary small mt12" type="submit">Save note</button></form>`:''}<div class="mt">${notice('Fictional record. No payment or external message is sent.','gray')}</div>`,'Prepared and delivered by '+esc(m.name),'drawer')}
function advanceOrder(id,next){const o=state.orders.find(o=>o.id===id);if(UI.role!=='merchant'||!o||o.merchant!==MERCHANT)return toast('This action belongs to the order’s merchant.');if(!((o.status==='new'&&next==='preparing')||(o.status==='preparing'&&next==='ready')))return toast('That transition is not available.');if(next==='preparing'&&!o.stockReserved){for(const item of o.items){const p=state.products.find(p=>p.id===item.productId&&p.merchant===MERCHANT);if(!p||!p.active||p.stock<item.qty)return toast('Review stock availability before accepting this order.')}for(const item of o.items){let p=getProduct(item.productId),before=p.stock;p.stock-=item.qty;state.stockLog.unshift({id:'ST-'+Date.now()+p.id,product:p.name,before,after:p.stock,reason:'Reserved for '+o.id,time:'This demo session'})}o.stockReserved=true}o.status=next;o.events.push({label:STATUS[next],time:'This demo session'});logAction('Order '+STATUS[next],o.id);closeModal();render();orderDetail(id);toast(next==='preparing'?'Demo order accepted. Stock reserved.':'Order is ready. Assign a merchant-owned rider next.')}
function authDialog(){modal('Welcome to your local bazar.',`<div class="auth-brand">${brand()}</div><p class="body-copy mb">Your basket stays intact. Sign in to confirm your order details.</p>${button('Continue with Google','google-demo',{},'secondary full','globe')}<div class="auth-divider">or use your phone number</div><form data-form="auth-phone">${field('Phone number','phone','03000000000','tel','required pattern="[+0-9 ()-]{10,17}" autocomplete="off"')}<button type="submit" class="btn full mt">Continue with phone number</button></form><div class="mt">${notice('Demo sign-in only. No Google login or SMS request is made. Use fictional details.','gray','lock')}</div>`,'Browse first. Sign in when you’re ready.')}
function verifyDialog(){modal('Enter the demo code.',`<p class="body-copy mb">No SMS was sent. Use <strong>123456</strong> to preview verification.</p><form data-form="auth-code">${field('6-digit demo code','code','','text','required pattern="[0-9]{6}" inputmode="numeric" maxlength="6" autocomplete="off"')}<button type="submit" class="btn full mt">Verify demo code</button></form><div class="mt">${notice('This does not authenticate a real user. The OTP provider remains undecided.','gray')}</div>`)}
function signInDemo(){state.auth=true;logAction('Demo customer signed in',CUSTOMER);closeModal();render();toast('Demo sign-in complete. Review and place your order.')}
function changeQty(id,delta,kind='cart',replace=false){const p=state.products.find(x=>x.id===id);if(!p)return;delta=Number(delta);if(delta>0&&(!p.active||p.review!=='Published'||p.stock<1))return toast('This product is not currently available.');if(kind==='pos'&&(UI.role!=='merchant'||p.merchant!==MERCHANT))return toast('Only this shop’s products can be added to the POS bill.');let obj=kind==='pos'?state.pos:state.basket.items;if(kind==='cart'&&delta>0&&basketCount()&&state.basket.merchant!==p.merchant&&!replace){confirmDialog('Start a basket from this shop?','This prototype uses one shop per checkout. Starting with '+esc(getMerchant(p.merchant).name)+' replaces the current demo basket. The production multi-shop policy is not decided.','replace-basket',{id},'Start new basket');return}if(kind==='cart'&&(!basketCount()||replace)){state.basket.merchant=p.merchant;if(replace)state.basket.items={};obj=state.basket.items}let n=Math.max(0,(obj[id]||0)+delta);if(n>p.stock)return toast('Only '+p.stock+' packs are available in the demo.');if(n)obj[id]=n;else delete obj[id];persist();render()}
function placeOrder(form){let t=basketTotals(),m=getMerchant(state.basket.merchant);if(!basketCount())return errorIn(form,'Your basket is empty.');if(t.subtotal<m.min)return errorIn(form,'Add '+money(m.min-t.subtotal)+' more to reach this sample shop minimum.');if(m.status!=='Active'||m.id===MERCHANT&&!state.shopOpen)return errorIn(form,'This shop is not accepting new demo orders.');for(const p of basketItems()){if(!p.active||p.qty>p.stock)return errorIn(form,'Availability changed for '+p.name+'. Please review the basket.')}let f=new FormData(form);state.checkoutPayment=String(f.get('payment'));state.customerProfile.name=String(f.get('name')).trim();state.address={...state.address,area:String(f.get('area')),detail:String(f.get('address')).trim(),instructions:String(f.get('instructions')).trim()};persist();if(!state.auth){authDialog();return}const n=Math.max(1040,...state.orders.map(o=>Number(o.id.slice(3))||0))+1;const id='SB-'+n;state.orders.unshift({id,merchant:m.id,customer:CUSTOMER,customerName:state.customerProfile.name||'Demo customer',area:state.address.area,status:'new',items:basketItems().map(p=>({productId:p.id,name:p.name,unit:p.unit,price:p.price,qty:p.qty})),...t,discount:0,payment:f.get('payment')==='Online'?'Online':'COD',rider:null,time:'14:30',events:[{label:'Order submitted',time:'This demo session'}],note:state.address.instructions,created:n,cashCollected:false,cashRemitted:false,pickupChecked:false});state.activeOrder=id;state.basket.items={};logAction('Demo order submitted',id);go(UI.role+'/tracking?order='+id);toast('Order sent to '+m.name+'. Waiting for merchant acceptance.')}
function assignRiderDialog(id){const o=state.orders.find(o=>o.id===id&&o.merchant===MERCHANT);if(!o||o.status!=='ready'||UI.role!=='merchant')return toast('Prepare this order first.');const list=state.riders.filter(r=>r.merchant===MERCHANT&&['Available','On delivery'].includes(r.status)&&(r.id!==RIDER||state.riderOnline));modal('Assign your rider',`<form data-form="assign-rider" data-id="${id}"><div class="stack">${list.map(r=>`<label class="checkline"><input type="radio" name="rider" value="${r.id}" ${r.id===(o.rider||RIDER)?'checked':''} required><span class="avatar">${r.name.charAt(0)}</span><span class="grow"><strong>${r.name}</strong><small>${r.status} · ${getMerchant(r.merchant).name}</small></span></label>`).join('')||'<p class="small muted">No eligible riders. Set your demo rider online first.</p>'}</div><p class="tiny mt12">Riders from other merchants cannot be selected. Capacity rules are not implemented.</p><button type="submit" class="btn full mt" ${list.length?'':'disabled'}>Assign demo delivery</button></form>`,'#'+id+' · merchant-owned dispatch')}
function riderDetail(id){let r=state.riders.find(r=>r.id===id);if(!r||UI.role==='merchant'&&r.merchant!==MERCHANT)return;let orders=state.orders.filter(o=>o.rider===id),due=orders.filter(o=>o.status==='delivered'&&o.payment==='COD'&&o.cashCollected&&!o.cashRemitted);modal(r.name,`<div class="row"><span class="avatar">${r.name.charAt(0)}</span><div><h3>${getMerchant(r.merchant).name}</h3><p class="tiny">${r.id} · Merchant-owned rider</p></div></div><div class="detail-grid"><div><small>Assigned active orders</small><strong>${orders.filter(o=>['ready','picked','arrived'].includes(o.status)).length}</strong></div><div><small>Cash awaiting handover</small><strong>${money(due.reduce((s,o)=>s+o.total,0))}</strong></div></div><h3 class="mb12">Assigned orders</h3>${orders.slice(0,7).map(o=>`<div class="list-row"><div class="grow"><strong class="small">${o.id}</strong><p>${o.customerName}</p></div>${statusTag(o.status)}</div>`).join('')}${UI.role==='merchant'&&due.some(o=>o.handoverRequested)?`<div class="mt">${button('Confirm requested cash handover','cash-handover-confirm',{rider:id},'full','cash')}</div>`:''}<div class="mt">${notice('Admin can inspect the association. The merchant owns dispatch and cash receipt.','gray')}</div>`,'Fictional rider profile','drawer')}
function settlementDetail(id){let l=ledger(id);modal('Merchant statement',`<h3 class="mb12">${getMerchant(id).name}</h3>${notice(state.commission+'% fee is illustrative. No money is moved.','amber')}<div class="summary-lines"><div><span>Online collections</span><strong>${money(l.onlineGross,true)}</strong></div><div><span>Illustrative platform fee</span><strong>−${money(l.onlineFee,true)}</strong></div><div class="total"><span>Online payable</span><span>${money(l.payable,true)}</span></div></div><div class="divider"></div><div class="summary-lines"><div><span>COD retained by merchant</span><strong>${money(l.codGross,true)}</strong></div><div><span>Separate COD fee receivable</span><strong>${money(l.codFee,true)}</strong></div></div><p class="tiny mt12">No automatic netting. No taxes, gateway fees, refunds or reserves are modelled.</p><div class="mt row">${button(state.settlementDrafts.includes(id)?'Draft already prepared':'Prepare local draft','prepare-statement',{id},'grow','document')}${button('Export CSV','export-statement',{id},'secondary','export')}</div>`,'Delivered orders only · demo calculations','drawer')}
function merchantDetail(id){const m=getMerchant(id);modal(m.name,`<div class="row between">${statusTag(m.status)}<span class="tiny">${m.id} · Fictional shop</span></div><div class="detail-grid"><div><small>Service area</small><strong>${m.area}</strong></div><div><small>Merchant riders</small><strong>${state.riders.filter(r=>r.merchant===id).length}</strong></div><div><small>Delivery charge (demo)</small><strong>${money(m.fee)}</strong></div><div><small>Order minimum (demo)</small><strong>${money(m.min)}</strong></div></div>${m.status==='Pending review'?`<h3 class="mb12">Onboarding checklist</h3><form data-form="approve-merchant" data-id="${id}"><div class="stack">${['Shop information reviewed','Delivery ownership reviewed','Service-area information reviewed'].map((t,i)=>`<label class="checkline"><input type="checkbox" name="check${i}" required><span>${t}</span></label>`).join('')}</div><div class="mt">${notice('Actual identity documents are not included. This only simulates approval; it is not verification.','amber')}</div><button type="submit" class="btn full mt">Simulate approval</button></form>`:`<div class="mt">${button(m.status==='Active'?'Pause shop':'Resume shop','merchant-status',{id},'secondary full',m.status==='Active'?'pause':'play')}</div>`}<div class="divider"></div>${notice('Each merchant owns its stock and delivery arrangements.','gray','shop')}`,'Merchant review · platform administration','drawer')}
function listingReview(id){const p=getProduct(id);modal('Review listing',`<div class="row"><div class="cell-thumb" style="width:75px;height:85px;border-radius:12px;overflow:hidden">${packshot(p)}</div><div><h3>${esc(p.name)}</h3><p class="small muted mt12">${esc(p.unit)} · ${money(p.price)}</p></div></div><div class="detail-grid"><div><small>Merchant</small><strong>${getMerchant(p.merchant).name}</strong></div><div><small>Review status</small><strong>${p.review}</strong></div><div><small>Category</small><strong>${p.category}</strong></div><div><small>Stock (merchant owned)</small><strong>${p.stock} packs</strong></div></div>${notice('Sample artwork cannot verify the actual product. Production moderation needs real merchant imagery and details.','gray')}<form data-form="listing-review" data-id="${id}">${selectField('Review decision','decision',['Publish demo listing','Request changes'],p.review==='Published'?'Request changes':'Publish demo listing')}<label class="field mt12">Review note<textarea name="note" required maxlength="400" placeholder="Explain the review decision…"></textarea></label><button type="submit" class="btn full mt">Save review decision</button></form>`,'Admin review · demo only','drawer')}
function exportOrders(){let orders=UI.role==='merchant'?ownOrders():state.orders;downloadCSV('SirfBazar_Demo_Orders.csv',[['Demo order','Merchant','Status','Items subtotal PKR','Merchant delivery PKR','Total PKR','Payment'],...orders.map(o=>[o.id,getMerchant(o.merchant).name,STATUS[o.status],o.subtotal,o.fee,o.total,o.payment])]);toast('Demo order CSV exported.')}
function exportProducts(){let products=UI.role==='merchant'?state.products.filter(p=>p.merchant===MERCHANT):state.products;downloadCSV('SirfBazar_Demo_Products.csv',[['SKU','Product','Merchant','Unit','Price PKR','Quantity','Review'],...products.map(p=>[p.sku,p.name,getMerchant(p.merchant).name,p.unit,p.price,p.stock,p.review])]);toast('Demo product CSV exported.')}
function exportLedger(id){let rows=(id?[getMerchant(id)]:UI.role==='merchant'?[getMerchant()]:state.merchants.filter(m=>m.status==='Active')).map(m=>ledger(m.id));downloadCSV('SirfBazar_Demo_Statements.csv',[['ILLUSTRATIVE ONLY','Commission percent',state.commission],['Merchant','Online collections','Demo online commission','Online merchant payable','COD retained by merchant','COD commission receivable'],...rows.map(r=>[getMerchant(r.merchant).name,r.onlineGross.toFixed(2),r.onlineFee.toFixed(2),r.payable.toFixed(2),r.codGross.toFixed(2),r.codFee.toFixed(2)])]);toast('Illustrative ledger CSV exported.')}
function walkthrough(){modal('Follow one order across the apps.',`${notice('Use the top preview rail to change roles. State is shared inside this suite and saved in this browser.','gray')}<div class="stack">${[['Shop as a customer','Add milk, bread and eggs. Continue to checkout, use demo sign-in code 123456, then explicitly place the order.'],['Prepare as the merchant','Open the newest order for Gulberg General Store. Accept it, mark it ready and assign Hamza (R01).'],['Deliver as the rider','Select that assignment. Check every pickup item, confirm pickup, mark arrived and complete with code 1234. Confirm cash collection for COD.'],['Review the marketplace','The customer tracking and platform order views now show Delivered. COD and online amounts stay separate.'],['Hand over cash','Rider → Cash → Request handover. Merchant → My riders → Hamza → Confirm requested handover.']].map(([h,p],i)=>`<div class="access-step"><b>${i+1}</b><div><strong>${h}</strong><p>${p}</p></div></div>`).join('')}</div><div class="mt row">${goButton('Start with customer app','customer/home','','arrow')}${button('Module mapping','module-guide',{},'secondary','document')}</div>`,'All steps are local simulations. No orders, payments or messages are sent.','wide')}
function moduleGuide(){modal('Module structure',`<div class="table-wrap"><table class="data-table guide-table"><thead><tr><th>Product</th><th>Designed modules</th></tr></thead><tbody>${Object.entries(NAV).map(([r,rows])=>`<tr><td><strong>${ROLE_LABEL[r]}</strong><br>${rows.length} route views</td><td>${rows.map(a=>a[1]+(a[4]?' (proposed)':'')).join(' · ')}</td></tr>`).join('')}</tbody></table></div><div class="mt">${notice('DreamPOS is the module and layout reference, not a bundled template. The source here is original HTML/CSS/JavaScript. Payroll, manufacturing, platform warehouses and a platform-owned delivery fleet are not part of this design.','gray')}</div><div class="mt">${button('Order walkthrough','guide',{},'secondary','arrow')}</div>`,'Grouped retail modules adapted to SirfBazar ownership boundaries.','wide')}
function globalSearchDialog(){modal('Search your workspace',`<label class="search mb">${icon('search')}<input id="global-command" data-global-search="true" placeholder="Search modules, orders or products…" autocomplete="off" aria-label="Search workspace"></label><div id="command-results"></div>`);updateGlobalResults('')}
function updateGlobalResults(q){q=q.toLowerCase();let nav=(NAV[UI.role]||NAV.admin).filter(n=>n[1].toLowerCase().includes(q));let ord=(UI.role==='merchant'?ownOrders():UI.role==='admin'?state.orders:customerOrders()).filter(o=>(o.id+' '+o.customerName+' '+getMerchant(o.merchant).name).toLowerCase().includes(q));document.getElementById('command-results').innerHTML=`<p class="eyebrow mb12">Modules</p>${nav.slice(0,7).map(n=>`<button class="list-button row" data-act="go" data-route="${UI.role==='suite'?'admin':UI.role}/${n[0]}">${icon(n[2])}<strong class="grow small">${n[1]}</strong>${icon('arrow','sm')}</button>`).join('')}${q?`<p class="eyebrow mt mb12">Orders</p>${ord.slice(0,4).map(o=>`<button class="list-button row" data-act="order-detail" data-id="${o.id}">${icon('orders')}<div class="grow"><strong class="small">${o.id}</strong><p class="tiny">${o.customerName}</p></div>${statusTag(o.status)}</button>`).join('')}`:''}${!nav.length&&!ord.length?'<p class="small muted">No matching records.</p>':''}`}

const ACTIONS={
 'skip-content':()=>{let main=document.querySelector('main');if(main){main.setAttribute('tabindex','-1');main.focus();}},
 'go':d=>go(d.route),'close-modal':()=>closeModal(),'guide':walkthrough,'module-guide':moduleGuide,'global-search':globalSearchDialog,
 'toggle-menu':()=>{UI.menu=!UI.menu;document.querySelector('.ops-sidebar')?.classList.toggle('open',UI.menu);document.getElementById('scrim')?.classList.toggle('show',UI.menu)},
 'tab':d=>{UI.tab=d.value;UI.pageNumber=1;render()},'sort':d=>{UI.sort=UI.sort===d.key?'-'+d.key:d.key;render()},'table-page':d=>{UI.pageNumber=Number(d.page);render()},'clear-filters':()=>{UI.tab='All';UI.query='';UI.pageNumber=1;render()},
 'filtered-route':d=>go(d.role+'/'+d.page+'?tab='+encodeURIComponent(d.tab)),
 'category':d=>go((UI.role==='website'?'website':'customer')+'/categories?category='+encodeURIComponent(d.category)),
 'catalog-filter':d=>{UI.category=d.category;render()},'clear-catalog':()=>{UI.category='All';UI.query='';render()},'pos-category':d=>{UI.category=d.category;render()},
 'quantity':d=>changeQty(d.id,d.delta,d.kind),'replace-basket':d=>{closeModal();changeQty(d.id,1,'cart',true)},
 'save-product':d=>{if(state.saved.includes(d.id))state.saved=state.saved.filter(x=>x!==d.id);else state.saved.push(d.id);persist();render();toast(state.saved.includes(d.id)?'Product saved.':'Product removed from saved items.')},
 'demo-basket':()=>{state.basket={merchant:MERCHANT,items:{P01:1,P02:1,P03:1}};persist();render();toast('Demo essentials added.')},
 'auth':authDialog,'google-demo':()=>modal('Google sign-in preview',`<p class="body-copy">A production Google authentication flow would return the signed-in customer here. This button only sets a fictional demo profile.</p><div class="mt">${button('Use demo Google profile','google-confirm',{},'full','users')}</div>`),'google-confirm':signInDemo,'signout':()=>{state.auth=false;persist();render();toast('Signed out of the demo. Your basket is unchanged.')},
 'address':()=>modal('Where should we deliver?',`<form data-form="address">${selectField('Neighbourhood','area',['Gulberg','Model Town','Johar Town','DHA'],state.address.area)}<label class="field mt12">Demo delivery note<textarea name="instructions" maxlength="180">${esc(state.address.instructions)}</textarea></label><button type="submit" class="btn full mt">Use this demo area</button></form><div class="mt">${notice('Manual area selection only. No automatic location permission or GPS request is made. Production should offer both permission-aware detection and a manual option.','gray','pin')}</div>`),

 'decline-order':d=>modal('Decline this demo order?',`<form data-form="decline-order" data-id="${d.id}">${selectField('Reason','reason',['An item is unavailable','Shop cannot fulfil now','Other fulfilment issue'])}<button type="submit" class="btn danger full mt">Decline order</button></form>`,'#'+d.id+' · customer payment is not automatically refunded'),

    else if(action==='apply-hex')applyHex();
    else if(action==='reset'){theme={...DEFAULT};dialog.querySelector('#theme-hex').value=theme.color;dialog.querySelector('#theme-validation').textContent='';dialog.querySelector('#theme-hex').removeAttribute('aria-invalid');apply();toast('Original SirfBazar theme restored. Your demo records are unchanged.');}
    else if(action==='css')exportCSS();
    else if(action==='json')downloadFile('sirfbazar-theme.json',new Blob([JSON.stringify(theme,null,2)],{type:'application/json'}));
    else if(action==='import')dialog.querySelector('#theme-import').click();
    else if(action==='html')exportHTML();
    else if(action==='sample'){toast('Sample primary action. Theme changes apply to every interface.');}
  });
  dialog.querySelector('#theme-color-picker').addEventListener('input',e=>{set({color:e.target.value});dialog.querySelector('#theme-hex').value=theme.color});
  dialog.querySelector('#theme-hex').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyHex()}});
  dialog.querySelector('#theme-hex').addEventListener('input',()=>{dialog.querySelector('#theme-validation').textContent='';dialog.querySelector('#theme-hex').removeAttribute('aria-invalid')});
  dialog.querySelector('#theme-logo').addEventListener('change',e=>set({previewLogo:e.target.checked}));
  dialog.querySelector('#theme-import').addEventListener('change',async e=>{
    const file=e.target.files?.[0];if(!file)return;
    try{if(file.size>32768)throw new Error('Theme JSON must be under 32 KB.');const parsed=validate(JSON.parse(await file.text()),true);theme=parsed;apply();dialog.querySelector('#theme-hex').value=theme.color;dialog.querySelector('#theme-validation').textContent='';dialog.querySelector('#theme-hex').removeAttribute('aria-invalid');toast('Theme imported. Original logo assets are unchanged.');}
    catch(err){error(err instanceof SyntaxError?'The selected file is not valid JSON.':err.message)}finally{e.target.value=''}
  });
  dialog.addEventListener('cancel',e=>{e.preventDefault();close()});dialog.addEventListener('close',refreshControls);
  document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key.toLowerCase()==='t'&&!e.target.closest('input,textarea,select,[contenteditable="true"]')&&!document.getElementById('dialog').open){e.preventDefault();dialog.open?close():open()}if(e.key==='Escape'&&dialog.open){e.preventDefault();close()}});
  media.addEventListener('change',()=>{if(theme.mode==='system')apply(false)});
  let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(dialog.open){dialog.close();window.innerWidth<=800?dialog.showModal():dialog.show();refreshControls()}},180)});
  window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{theme=validate(JSON.parse(e.newValue));apply(false)}catch{}}});
  window.SBTheme={open,close,set,reset:()=>{theme={...DEFAULT};apply();return {...theme}},get:()=>({...theme}),tokens:()=>({...tokens}),contrast,normalizeHex,validate,exportCSS,exportHTML};
  apply();
  if(window.SB_BAKED_ROUTE&&!location.hash){go(window.SB_BAKED_ROUTE)}
  // Initial render happened before the new icon set was registered. Update once.
  render();
})();
</script></body></html>
